# docker-compose.yml — Gemini AI Agent + MCP Tools Server + OTel Collector
#
# Usage:
#   cp .env.example .env          # fill in your keys
#   docker compose up --build
#
# What runs:
#   gemini-agent     — Python web server (chat UI at http://localhost:5601), MCP client
#   mcp-tools-server — Standalone MCP server (Streamable HTTP) at http://localhost:5603/mcp
#   otel-collector   — Collects real container CPU/memory/net/logs → Elastic
#
# After startup, open:
#   Chat UI:  http://localhost:5601
#   APM:      <your KIBANA_ENDPOINT>/app/apm/services/gemini-demo-agent
#             (Service Map will also show mcp-tools-server, connected via MCP)

services:

  # ── Gemini chat agent ───────────────────────────────────────────────────────
  gemini-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: "${SVC_NAME:-gemini-demo-agent}"
    ports:
      - "${PORT:-5601}:${PORT:-5601}"
    environment:
      GEMINI_API_KEY:              "${GEMINI_API_KEY}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT}"
      ES_API_KEY:                  "${ES_API_KEY}"
      KIBANA_ENDPOINT:             "${KIBANA_ENDPOINT:-}"
      GEMINI_MODEL_POOL:           "${GEMINI_MODEL_POOL:-gemini-3-flash-preview,gemini-3.1-flash-lite}"
      SVC_NAME:                    "${SVC_NAME:-gemini-demo-agent}"
      PORT:                        "${PORT:-5601}"
      # Docker's internal DNS — reaches the mcp-tools-server service below
      MCP_SERVER_URL:              "http://mcp-tools-server:${MCP_PORT:-5603}/mcp"
    labels:
      # These labels help the OTel Collector identify this container
      app: "${SVC_NAME:-gemini-demo-agent}"
      service.name: "${SVC_NAME:-gemini-demo-agent}"
      deployment.environment: "demo"
    restart: unless-stopped
    depends_on:
      mcp-tools-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:${PORT:-5601}/api/config')"]
      interval: 15s
      timeout: 5s
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── MCP tools server ─────────────────────────────────────────────────────────
  # Standalone MCP server (Streamable HTTP) serving get_stock_price /
  # get_company_news / get_analyst_rating. Own OTel service, same Elastic backend
  # as gemini-agent — the APM Service Map will show both connected via the
  # propagated trace context.
  mcp-tools-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: "${MCP_SVC_NAME:-mcp-tools-server}"
    ports:
      - "${MCP_PORT:-5603}:${MCP_PORT:-5603}"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT}"
      ES_API_KEY:                  "${ES_API_KEY}"
      KIBANA_ENDPOINT:             "${KIBANA_ENDPOINT:-}"
      MCP_PORT:                    "${MCP_PORT:-5603}"
      MCP_SVC_NAME:                "${MCP_SVC_NAME:-mcp-tools-server}"
    labels:
      app: "${MCP_SVC_NAME:-mcp-tools-server}"
      service.name: "${MCP_SVC_NAME:-mcp-tools-server}"
      deployment.environment: "demo"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:${MCP_PORT:-5603}/health')"]
      interval: 15s
      timeout: 5s
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── OTel Collector ──────────────────────────────────────────────────────────
  # Collects real Docker container metrics and logs, sends to Elastic via OTLP.
  # Data shows up in:
  #   Kibana → Observability → Infrastructure (container CPU/memory/network)
  #   Kibana → Observability → Logs (container stdout/stderr)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.105.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yml:/etc/otelcol/config.yaml:ro
      # Docker socket — required for docker_stats receiver
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Container logs — required for filelog receiver
      # NOTE: On macOS/Docker Desktop, container logs live inside the VM.
      # Use the alternative logging approach below if this mount is empty.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT}"
      ES_API_KEY:                  "${ES_API_KEY}"
    depends_on:
      gemini-agent:
        condition: service_healthy
    restart: unless-stopped
    # The collector itself logs to stdout; suppress noisy debug output
    logging:
      driver: "json-file"
      options:
        max-size: "5m"

networks:
  default:
    name: elastic-agent-demo
